name: Controller tests
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  controller-tests:
    runs-on: ubuntu-24.04
    env:
      BACKUP_PROFILE: brote
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m pip install -r runtime/requirements.txt
      - run: python3 -m unittest discover -s tests -v
      - name: Verify psycopg and Docker pg_dump TLS against synthetic PostgreSQL
        run: python3 tests/tls_integration.py
      - name: Restore Supabase-shaped synthetic database with the production image
        run: python3 tests/restore_integration.py
